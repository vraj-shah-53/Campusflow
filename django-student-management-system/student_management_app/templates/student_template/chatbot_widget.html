<style>
    /* Premium AI Chatbot Widget Styles */
    #ai-chat-widget {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        font-family: 'Inter', 'Source Sans Pro', sans-serif;
    }

    #chat-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #007bff, #00d4ff);
        color: white;
        text-align: center;
        line-height: 60px;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #chat-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
    }

    #chat-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 450px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #eee;
    }

    /* Premium Header */
    #chat-header {
        background: linear-gradient(135deg, #007bff, #00d4ff);
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #chat-header h4 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
    }

    #chat-header h4 i {
        margin-right: 8px;
    }

    #close-chat {
        cursor: pointer;
        font-size: 18px;
        transition: color 0.2s;
    }

    #close-chat:hover {
        color: #e0e0e0;
    }

    #chat-body {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .chat-msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.4;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chat-msg.bot {
        background: #e9ecef;
        color: #333;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
    }

    .chat-msg.user {
        background: #007bff;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
    }

    #chat-input-area {
        padding: 15px;
        background: white;
        border-top: 1px solid #efefef;
        display: flex;
        gap: 10px;
    }

    #chat-input {
        flex: 1;
        padding: 10px 15px;
        border: 1px solid #e0e0e0;
        border-radius: 20px;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
    }

    #chat-input:focus {
        border-color: #007bff;
    }

    #send-btn {
        background: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.2s;
    }

    #send-btn:hover {
        background: #0056b3;
    }

    .typing-indicator {
        display: none;
        align-self: flex-start;
        background: #e9ecef;
        padding: 12px 14px;
        border-radius: 12px;
        border-bottom-left-radius: 2px;
        font-size: 12px;
        color: #777;
    }

    .typing-indicator span {
        display: inline-block;
        width: 4px;
        height: 4px;
        background-color: #777;
        border-radius: 50%;
        margin: 0 2px;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-indicator span:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
        }

        40% {
            transform: scale(1);
        }
    }
</style>

<div id="ai-chat-widget">
    <!-- Chat Button -->
    <div id="chat-btn">
        <i class="fas fa-comment-dots"></i>
    </div>

    <!-- Chat Window -->
    <div id="chat-window">
        <div id="chat-header">
            <h4><i class="fas fa-robot"></i> Campus AI Helper</h4>
            <i class="fas fa-times" id="close-chat"></i>
        </div>
        <div id="chat-body">
            <div class="chat-msg bot">
                Hello! I am your 24/7 AI Campus Helper. Feel free to ask me anything about your courses, attendance, or
                dashboard!
            </div>

            <div class="typing-indicator" id="bot-typing">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your doubt here..." autocomplete="off">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const chatBtn = document.getElementById("chat-btn");
        const chatWindow = document.getElementById("chat-window");
        const closeChat = document.getElementById("close-chat");
        const sendBtn = document.getElementById("send-btn");
        const chatInput = document.getElementById("chat-input");
        const chatBody = document.getElementById("chat-body");
        const typingIndicator = document.getElementById("bot-typing");

        // Toggle chat window
        chatBtn.addEventListener("click", () => {
            chatWindow.style.display = chatWindow.style.display === "flex" ? "none" : "flex";
            if (chatWindow.style.display === "flex") {
                chatInput.focus();
            }
        });

        closeChat.addEventListener("click", () => {
            chatWindow.style.display = "none";
        });

        // Send message
        function sendMessage() {
            const message = chatInput.value.trim();
            if (message === "") return;

            // Append User Message
            appendMessage("user", message);
            chatInput.value = "";

            // Show typing indicator
            chatBody.appendChild(typingIndicator);
            typingIndicator.style.display = "block";
            chatBody.scrollTop = chatBody.scrollHeight;

            // Send to Django backend
            fetch("{% url 'student_chatbot' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: new URLSearchParams({
                    "message": message
                })
            })
                .then(response => response.json())
                .then(data => {
                    typingIndicator.style.display = "none";
                    if (data.success) {
                        appendMessage("bot", data.reply);
                    } else {
                        appendMessage("bot", "Oops! I encountered an error. Please try again.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    typingIndicator.style.display = "none";
                    appendMessage("bot", "Sorry, I am currently offline. Please try later.");
                });
        }

        sendBtn.addEventListener("click", sendMessage);
        chatInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        function appendMessage(sender, text) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("chat-msg", sender);
            msgDiv.innerText = text;
            chatBody.insertBefore(msgDiv, typingIndicator); // insert before typing indicator
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    });
</script>
